name: Deploy to Azure

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Build and Deploy API to Azure Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests before deploying
        run: dotnet test StageFlow.sln --configuration Release

      - name: Publish API
        run: dotnet publish src/StageFlow.Api/StageFlow.Api.csproj -c Release -o ./publish-api

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish-api

  deploy-frontend:
    name: Build and Deploy Frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build And Deploy SWA
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # URL publique de l'API (ex. https://stageflow-api.azurewebsites.net), injectée au build Vite.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/src/stageflow-client"
          api_location: ""
          output_location: "dist"
