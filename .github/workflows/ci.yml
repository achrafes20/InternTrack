name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-build-test:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore StageFlow.sln

      - name: Build Solution
        run: dotnet build StageFlow.sln --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        run: dotnet test StageFlow.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  frontend-build-lint:
    name: Build & Lint Frontend (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/stageflow-client/package-lock.json

      - name: Install dependencies
        working-directory: src/stageflow-client
        run: npm ci

      - name: TypeScript type-check and Vite Build
        working-directory: src/stageflow-client
        run: npm run build
