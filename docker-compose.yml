services:
  stageflow-db:
    image: postgres:16-alpine
    container_name: stageflow-db
    restart: always
    environment:
      POSTGRES_DB: stageflow_db
      POSTGRES_USER: stageflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stageflow_password}
    ports:
      # Exposé uniquement sur la machine hôte, jamais sur le réseau.
      # Port hôte 5433 par défaut : 5432 est souvent déjà pris par un PostgreSQL local (Odoo, installation native…).
      # L'API n'utilise pas ce port : elle joint la base via le réseau Docker interne (stageflow-db:5432).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stageflow_user -d stageflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  stageflow-api:
    build:
      context: .
      dockerfile: src/StageFlow.Api/Dockerfile
    container_name: stageflow-api
    restart: on-failure
    environment:
      # Démonstration locale : migrations et jeu de données activés.
      # En production, utilisez ASPNETCORE_ENVIRONMENT=Production et fournissez les secrets
      # via un gestionnaire de secrets (jamais de secret en clair dans le dépôt).
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=stageflow-db;Port=5432;Database=stageflow_db;Username=stageflow_user;Password=${POSTGRES_PASSWORD:-stageflow_password}
      - JwtSettings__Secret=${JWT_SECRET:-StageFlow-Dev-Only-Secret-Key-Change-Me-In-Production-2026-ENSA-PFE!}
      - JwtSettings__Issuer=StageFlowEnsa
      - JwtSettings__Audience=StageFlowClient
      - JwtSettings__AccessTokenExpirationMinutes=15
      - JwtSettings__RefreshTokenExpirationDays=7
      - Database__AutoMigrate=true
      - Database__SeedDemoData=${SEED_DEMO_DATA:-true}
      - AppConfig__FrontendBaseUrl=http://localhost:3000
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Smtp__Enabled=false
      # nginx (conteneur client) est le proxy de confiance : seules les requêtes venant des
      # réseaux privés Docker peuvent transmettre l'IP réelle via X-Forwarded-For.
      - ReverseProxy__KnownNetworks__0=172.16.0.0/12
      - ReverseProxy__KnownNetworks__1=192.168.0.0/16
      - ReverseProxy__KnownNetworks__2=10.0.0.0/8
      # Fichiers déposés et clés de protection des données (liens de réinitialisation) : persistés.
      - Storage__RootPath=/app/data/uploads
      - DataProtection__KeysPath=/app/data/keys
      - AppConfig__TimeZone=Africa/Casablanca
    volumes:
      - stageflow_data:/app/data
    ports:
      - "5000:8080"
    depends_on:
      stageflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  stageflow-client:
    build:
      context: ./src/stageflow-client
      dockerfile: Dockerfile
    container_name: stageflow-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      stageflow-api:
        condition: service_healthy

volumes:
  postgres_data:
  stageflow_data:
